        These vulnerabilities are only tagged at the product level. The <b>Suggested service</b> column is inferred from the ticket title text — it's a hint for Global team to backfill the correct <code>Service internal</code> value, not authoritative.
      </p>
      <table style="width:100%;border-collapse:collapse;font-size:12.5px">
        <thead>
          <tr style="background:#f3f4f6">
            <th style="text-align:left;padding:8px 10px;font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.4px;font-weight:700">Key</th>
            <th style="text-align:center;padding:8px 6px;font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.4px;font-weight:700">Priority</th>
            <th style="text-align:center;padding:8px 6px;font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.4px;font-weight:700">Risk</th>
            <th style="text-align:center;padding:8px 6px;font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.4px;font-weight:700">Status</th>
            <th style="text-align:left;padding:8px 10px;font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.4px;font-weight:700">Summary</th>
            <th style="text-align:left;padding:8px 10px;font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.4px;font-weight:700">Suggested service</th>
          </tr>
        </thead>
        <tbody>
          ${t.map(x => {
            const pri = (x.priority || "").toLowerCase();
            const priCls = pri==="high" || pri==="highest" ? "bad" : (pri==="medium" ? "warn" : "");
            const risk = (x.risk_rating || "").toLowerCase();
            const riskCls = risk==="critical" ? "bad" : risk==="high" ? "bad" : risk==="moderate" ? "warn" : "";
            const suggestion = x.suggested_service
              ? `<span style="background:#dbeafe;color:#1e40af;padding:2px 8px;border-radius:6px;font-weight:600;font-size:11px">${x.suggested_service}</span>`
              : `<span style="color:#94a3b8;font-style:italic;font-size:11px">no confident match</span>`;
            return `<tr style="border-top:1px solid #ede9fe">
              <td style="padding:8px 10px;font-family:ui-monospace,monospace;font-weight:700">
                <a href="${x.url}" target="_blank" rel="noopener" style="color:#2e5496;text-decoration:none">${x.key} ↗</a>
              </td>
              <td style="text-align:center;padding:8px 6px;font-weight:700" class="${priCls}">${x.priority || '—'}</td>
              <td style="text-align:center;padding:8px 6px;font-weight:700" class="${riskCls}">${x.risk_rating || '—'}</td>
              <td style="text-align:center;padding:8px 6px;color:#64748b">${x.status || '—'}</td>
              <td style="padding:8px 10px;color:#334155">${x.summary}</td>
              <td style="padding:8px 10px">${suggestion}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    </div>
  </details>`;
}

function unassignedRowSecurity(u, colCount){
  if(!u || !u.total) return "";
  return `<tr style="background:#faf5ff;border-top:2px solid #a78bfa">
    <td style="padding:12px 12px;font-weight:700;color:#7c3aed">
      <span style="background:#7c3aed;color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;margin-right:6px">UNASSIGNED</span>
      Product-level only (no service tag)
    </td>
    <td style="text-align:center;font-weight:700">${u.total}</td>
    <td style="text-align:center;font-weight:700;color:${u.open>0?'#a16207':'#334155'}">${u.open}</td>
    <td colspan="${colCount-3}" style="text-align:center;color:#94a3b8;font-size:12px;font-style:italic">Severity breakdown not available for unassigned items</td>
  </tr>`;
}

function cbeTotalsBlock(p){
  // Simplified project-level view: two side-by-side cards with severity/priority
  // breakdown for Security (Vulnerabilities) and Customer Issues from CBE.
  // No per-service breakdown — CBE data is a project-level signal now.
  const pv  = p.project_view || {};
  const sec = pv.security || {};
  const cust= pv.customer_issues || {};
  const secStatus  = (pv.source_status || {}).security;
  const custStatus = (pv.source_status || {}).customer_issues;

  const secLevels  = ["Critical","High","Moderate","Low"];
  const custLevels = cust.severity_levels || ["Highest","High","Medium","Low"];

  const box = (title, statusLabel, total, open, jiraUrl, levels, byOpen, sla) => {
    const status = statusLabel === "ok"
      ? `<span class="badge ok">LIVE</span>`
      : statusLabel === "not_configured" || !statusLabel
        ? `<span class="badge nc">NOT CONFIGURED</span>`
        : `<span class="badge err">ERROR</span>`;
    const rows = levels.map(l => {
      const n = (byOpen || {})[l] || 0;
      const c = n === 0 ? "#94a3b8" : (l === "Critical" || l === "Highest") ? "#dc2626" : (l === "High") ? "#d97706" : "#334155";
      return `<tr>
        <td style="padding:6px 10px;color:#475569;font-size:13px">${l}</td>
        <td style="padding:6px 10px;text-align:right;font-weight:800;font-size:14px;color:${c}">${n}</td>
      </tr>`;
    }).join("");
    const slaLine = sla && (sla.critical_breached || sla.high_breached)
      ? `<div style="margin-top:8px;padding:8px 10px;background:#fef2f2;border-left:3px solid #dc2626;border-radius:6px;font-size:12px;color:#991b1b">
           <b>${(sla.critical_breached||0) + (sla.high_breached||0)}</b> past SLA
           ${sla.critical_breached ? ` · ${sla.critical_breached} Critical > ${sla.critical_days}d` : ""}
           ${sla.high_breached ? ` · ${sla.high_breached} High > ${sla.high_days}d` : ""}
         </div>`
      : "";
    return `<div style="flex:1;min-width:280px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px 18px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div style="font-weight:800;font-size:14px;color:#1f3864">${title}</div>
        ${status}
      </div>
      <div style="display:flex;gap:24px;margin-bottom:12px">
        <div><div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;font-weight:700">Total</div><div style="font-size:26px;font-weight:800;color:#1f3864">${total ?? 0}</div></div>
        <div><div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;font-weight:700">Open</div><div style="font-size:26px;font-weight:800;color:${(open||0)>0?'#a16207':'#16a34a'}">${open ?? 0}</div></div>
      </div>
      <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:4px">Open by ${title.includes('Security')?'severity':'priority'}</div>
      <table style="width:100%;border-collapse:collapse">${rows}</table>
      ${slaLine}
      ${jiraUrl ? `<div style="margin-top:12px;text-align:right">
        <a href="${jiraUrl}" target="_blank" rel="noopener" style="font-size:12px;font-weight:600;color:#2e5496;text-decoration:none">View all in Jira ↗</a>
      </div>` : ""}
    </div>`;
  };

  const secCard = box("🛡️ Security (Vulnerabilities)", secStatus,
                       sec.total_vulnerabilities, sec.open_vulnerabilities,
                       sec.jira_ui_search_url,
                       secLevels, sec.open_by_severity, sec.sla);
  const custCard= box("📞 Customer Issues", custStatus,
                       cust.total, cust.open,
                       cust.jira_ui_search_url,
                       custLevels, cust.open_by_severity, null);

  return `<div style="display:flex;gap:14px;flex-wrap:wrap">${secCard}${custCard}</div>
    <p style="font-size:11px;color:#94a3b8;margin-top:12px">
      Project-level totals from CBE, filtered by <code>Product Assets = ${(p.project_view||{}).product_scope_value || p.project_config?.product_scope_value || "(scope)"}</code> and the current time window. No per-service breakdown — CBE data is treated as a single project signal.
    </p>`;
}

// Slim per-service summary — one row per service, four number columns:
//   Total tickets · Security tickets · Customer bugs · Feature work %
// No severity breakdown per row; keep it scannable for leadership.
function serviceQuickTable(p){
  const thStyle = 'text-align:center;font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.5px;font-weight:700;padding:10px 8px;background:#f8fafc;border-bottom:1px solid #e2e8f0';
  const nameThStyle = thStyle + ';text-align:left;padding-left:14px';
  const th = (l,wide=false)=>`<th style="${wide?nameThStyle:thStyle}">${l}</th>`;
  const cell = (n, color) => {
    const c = color || (n > 0 ? "#1e293b" : "#94a3b8");
    return `<td style="text-align:center;padding:9px 8px;font-weight:700;color:${c};font-size:13.5px">${n==null?'—':n}</td>`;
  };
  const rows = p.services.map((s, i) => {
    const src = s.source_status || {};
    // Total tickets: Jira main-project tickets for this service (component)
    const totalTix = (src.jira === "ok") ? ((s.tickets && s.tickets.total) ?? 0) : null;
    // Security tickets: CBE Vulnerabilities where Service internal = security_scope
    const secTix = (src.security === "ok") ? ((s.security && s.security.total_vulnerabilities) ?? 0) : null;
    const secOpen = (src.security === "ok") ? ((s.security && s.security.open_vulnerabilities) ?? 0) : null;
    // Customer bugs: CBE non-Vuln tickets where Service internal = security_scope
    const custTix = (src.customer_issues === "ok") ? ((s.customer_issues && s.customer_issues.total) ?? 0) : null;
    // Feature work %: from Jira main-project roadmap
    const featPct = (src.jira === "ok") ? ((s.roadmap && s.roadmap.feature_pct) ?? null) : null;

    const tierColor = (TIERS[s.tier] || TIERS.GREEN).color;
    const secColor  = secOpen > 0 ? "#dc2626" : (secTix > 0 ? "#d97706" : null);
    const custColor = custTix > 0 ? "#d97706" : null;
    const featColor = featPct == null ? null : (featPct < 80 ? "#d97706" : "#16a34a");

    return `<tr onclick="STATE.curService=${i};render();window.scrollTo({top:document.querySelector('.tabs')?.offsetTop||0,behavior:'smooth'})"
                 style="cursor:pointer;border-bottom:1px solid #f1f5f9"
                 onmouseover="this.style.background='#fbfcfe'" onmouseout="this.style.background=''">
      <td style="padding:9px 14px;font-weight:700;font-size:13.5px">
        <span class="pill" style="background:${tierColor};font-size:10px;padding:3px 8px;margin-right:8px">${s.tier}</span>
        ${s.name}
      </td>
      ${cell(totalTix)}
      ${cell(secTix==null?null:`${secTix}${secOpen>0?` (${secOpen} open)`:''}`, secColor)}
      ${cell(custTix, custColor)}
      ${cell(featPct==null?null:`${featPct}%`, featColor)}
    </tr>`;
  }).join("");

  return `<table style="width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden">
    <thead><tr>
      ${th("Service", true)}
      ${th("Total tickets")}
      ${th("Security")}
      ${th("Customer bugs")}
      ${th("Feature %")}
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>
  <p style="font-size:11px;color:#94a3b8;margin-top:10px">
    <b>Total tickets</b>: Jira ${p.key} component tickets in window. <b>Security</b>: CBE Vulnerabilities tagged with the service's <code>Service internal</code>. <b>Customer bugs</b>: CBE non-Vuln tickets. <b>Feature %</b>: share of feature-type tickets (target ≥80%). Click a row for the per-service deep-dive tab.
  </p>`;
}

// NOTE: securityMatrixOnly() and customerMatrixOnly() were removed —
// the per-service CBE breakdown with severity columns was too heavy.
// serviceQuickTable() (above) is the leaner replacement — 4 numeric columns per service.

function projectOverview(p){
  const pv = p.project_view || {};
  const src = pv.source_status || {};
  const st = src.jira;
  let jiraBlock = "";
  if(st === "not_configured") jiraBlock = `<div class="section"><h3>Project overview (whole Jira project)</h3><div class="notconfig">Jira not configured.</div></div>`;
  else if(st !== "ok")        jiraBlock = `<div class="section"><h3>Project overview (whole Jira project)</h3><div class="unavailable">Jira unavailable — ${st}</div></div>`;
  else {
    const tt = (pv.tickets && pv.tickets.type) || {}, tot=(tt.Bug||0)+(tt.Feature||0)+(tt.Task||0);
    const bugPct = tot? Math.round((tt.Bug||0)/tot*100) : null;
    jiraBlock = `<div class="section"><h3>${p.name} — Product tickets (from Jira project ${(p.project_view?.tickets)?p.key:p.key}) ${srcBadge(st)}</h3>
      <div class="cards">
        <div class="card"><div class="v">${num(pv.tickets.total)}</div><div class="k">Total tickets</div></div>
        <div class="card"><div class="v">${num(pv.tickets.open)}</div><div class="k">Open</div></div>
        <div class="card"><div class="v ${bugPct>50?'bad':bugPct>35?'warn':'good'}">${bugPct==null?'—':bugPct+'%'}</div><div class="k">Bug ratio</div></div>
        <div class="card"><div class="v ${(pv.tickets.sev.Critical||0)>0?'bad':'good'}">${pv.tickets.sev.Critical||0}</div><div class="k">Critical open</div></div>
        <div class="card"><div class="v">${num(pv.cycle.median_days,'d')}</div><div class="k">Median close</div></div>
        <div class="card"><div class="v ${pv.reopen.rate_pct>3?'bad':'good'}">${num(pv.reopen.rate_pct,'%')}</div><div class="k">Reopen rate</div></div>
        <div class="card"><div class="v">${num(pv.throughput_per_week)}</div><div class="k">Closed / week</div></div>
        <div class="card"><div class="v">${num(pv.roadmap.feature_pct,'%')}</div><div class="k">Feature work</div></div>
      </div></div>`;
  }
  return jiraBlock + projectMatrixSection(p) + securitySection(pv, src, "— project-wide roll-up") + customerSection(pv, src, "— project-wide roll-up");
}
function tabs(p){
  return `<div class="tabs">${p.services.map((s,i)=>`
    <div class="tab ${i===STATE.curService?'active':''}" onclick="STATE.curService=${i};render()">
      <span class="pill" style="background:${TIERS[s.tier].color}">${s.tier}</span>
      ${s.name}
    </div>`).join("")}</div>`;
}
function serviceDetail(s){
  const src=s.source_status;
  const tt=s.tickets.type||{}, tot=(tt.Bug||0)+(tt.Feature||0)+(tt.Task||0);
  const bugPct = tot? Math.round((tt.Bug||0)/tot*100) : null;
  function jiraSection(){
    if(src.jira==="not_configured") return `<div class="notconfig">Jira not configured.</div>`;
    if(src.jira!=="ok") return `<div class="unavailable">Jira unavailable — ${src.jira}</div>`;
    const secOk = src.security==="ok" && s.security;
    const custOk = src.customer_issues==="ok" && s.customer_issues;
    const secOpen = secOk ? num(s.security.open_vulnerabilities) : "—";
    const secCrit = secOk ? (s.security.open_by_severity?.Critical||0) : 0;
    const custOpen = custOk ? num(s.customer_issues.open) : "—";
    // Don't mask problems as blank cards — show the real status text when a source
    // isn't "ok" (not_configured vs an actual fetch error), same policy as GH/Datadog below.
    const secNote = (!secOk && src.security!=="not_configured") ? `<div class="unavailable" style="margin-top:8px">Security unavailable — ${src.security}</div>` : (src.security==="not_configured" ? `<div class="notconfig" style="margin-top:8px">Security not configured for this service.</div>` : "");
    const custNote = (!custOk && src.customer_issues!=="not_configured") ? `<div class="unavailable" style="margin-top:8px">Customer issues unavailable — ${src.customer_issues}</div>` : (src.customer_issues==="not_configured" ? `<div class="notconfig" style="margin-top:8px">Customer issues not configured for this service.</div>` : "");
    return `<div class="cards">
      <div class="card"><div class="v">${num(s.tickets.total)}</div><div class="k">Total tickets</div></div>
      <div class="card"><div class="v">${num(s.tickets.open)}</div><div class="k">Open</div></div>
      <div class="card"><div class="v ${bugPct>50?'bad':bugPct>35?'warn':'good'}">${bugPct==null?'—':bugPct+'%'}</div><div class="k">Bug ratio</div></div>
      <div class="card"><div class="v ${(s.tickets.sev.Critical||0)>0?'bad':'good'}">${s.tickets.sev.Critical||0}</div><div class="k">Critical open</div></div>
      <div class="card"><div class="v">${num(s.cycle.median_days,'d')}</div><div class="k">Median close</div></div>
      <div class="card"><div class="v ${s.reopen.rate_pct>3?'bad':'good'}">${num(s.reopen.rate_pct,'%')}</div><div class="k">Reopen rate</div></div>
      <div class="card"><div class="v">${num(s.throughput_per_week)}</div><div class="k">Closed / week</div></div>
      <div class="card"><div class="v">${num(s.roadmap.feature_pct,'%')}</div><div class="k">Feature work</div></div>
      <div class="card"><div class="v ${secCrit>0?'bad':'good'}">${secOpen}</div><div class="k">Security issues open</div></div>
      <div class="card"><div class="v">${custOpen}</div><div class="k">Customer issues open</div></div></div>${secNote}${custNote}`;
  }
  function ghSection(){
    if(src.github==="not_configured") return `<div class="notconfig">GitHub not configured.</div>`;
    if(src.github!=="ok") return `<div class="unavailable">GitHub unavailable — ${src.github}</div>`;
    const g=s.github;
    return `<div>${kv("Open PRs",g.open_prs)}${kv("Median PR merge",g.median_merge_hours+"h",g.median_merge_hours>16?'bad':g.median_merge_hours>10?'warn':'good')}${kv("PRs reviewed",g.reviewed_pct+"%",g.reviewed_pct<85?'bad':'good')}${kv("Branch protection",g.branch_protection?'Enforced':'Missing',g.branch_protection?'good':'bad')}</div>`;
  }
  function ddSection(){
    if(src.datadog==="not_configured") return `<div class="notconfig">Datadog not configured.</div>`;
    if(src.datadog!=="ok") return `<div class="unavailable">Datadog unavailable — ${src.datadog}</div>`;
    const d=s.datadog;
    const link=(url,label)=> url? `<a href="${url}" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;text-underline-offset:2px">${label} ↗</a>` : label;
    const monVal = d.monitors_url ? link(d.monitors_url, d.monitors) : d.monitors;
    const alertVal = (d.alerting>0 && d.alerting_url) ? link(d.alerting_url, d.alerting) : d.alerting;
    return `<div>${kv("Active monitors",monVal)}${kv("Muted",d.muted,d.muted>3?'warn':'good')}${kv("Alerting now",alertVal,d.alerting>0?'warn':'good')}</div>`;
  }
  const t=TIERS[s.tier];
  const gaps=[...s.gates.critical_gaps.map(g=>["crit",g]), ...s.gates.standard_gaps.map(g=>["std",g])];
  const strat=s.gates.strategic_fail?`<li><span class="tag strat">Strategic</span> Fails growth alignment</li>`:"";
  return `<div class="dhead" style="background:#fafbfe">
    <span class="pill" style="background:${t.color}">${s.tier}</span>
    <span class="title">${s.name}</span>
    <span class="why">Jira scope: <code>${s.jira_scope||'(none)'}</code> &nbsp;·&nbsp; Jira ${srcBadge(src.jira)} GitHub ${srcBadge(src.github)} Datadog ${srcBadge(src.datadog)}</span></div>
    <div class="section"><h3>Ticket health (Jira, scoped to this service)</h3>${jiraSection()}</div>
    <div class="section"><h3>Code &amp; pipeline</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
      <div><div style="font-size:11px;color:#94a3b8;font-weight:700;margin-bottom:6px">GITHUB</div>${ghSection()}</div>
      <div><div style="font-size:11px;color:#94a3b8;font-weight:700;margin-bottom:6px">DATADOG</div>${ddSection()}</div></div></div>
    <div class="section"><h3>Gate scoring → service decision</h3><div class="gatebox">
      ${s.gates.insufficient_jira ? `<div class="unavailable" style="margin-bottom:12px">
        <b>Insufficient Jira data</b> — filter <code>${s.jira_scope}</code> returned 0 tickets. Fix <code>jira_scope</code> in <code>projects.json</code> before this service's tier can be trusted.
      </div>` : ""}
      <div style="display:flex;gap:22px;font-size:13px;margin-bottom:6px">
        <span><b class="${s.gates.critical_gaps.length?'bad':'good'}">${s.gates.critical_gaps.length}</b> critical gaps</span>
        <span><b class="${s.gates.strategic_fail?'bad':'good'}">${s.gates.strategic_fail?'Fail':'Pass'}</b> strategic</span>
        <span><b>${s.gates.standard_gaps.length}</b> standard gaps</span></div>
      <ul class="gaplist">${strat}${gaps.map(g=>`<li><span class="tag ${g[0]}">${g[0]==='crit'?'Critical':'Standard'}</span> ${g[1]}</li>`).join("")||(!s.gates.strategic_fail?'<li class="good">✓ No gaps found in configured sources.</li>':'')}</ul>
      <div class="verdict" style="background:${t.color}"><span class="vt">${t.label}</span><span class="vd">${t.desc}</span></div></div></div>`;
}

// ============================ ROUTER ============================
function render(){ (STATE.view === "landing" ? renderLanding : renderProject)(); }
async function boot(){
  const p = parseHash();
  STATE.view = p.view;
  if(p.view === "project"){ STATE.project = p.project; STATE.window = p.window; await loadReport(); }
  else { await loadPortfolio(); }
}
window.addEventListener("hashchange", boot);
boot();
</script>
